name: Automated Trading Scheduler

on:
  schedule:
    - cron: '*/30 * * * *' # 매 30분마다 실행 (사용자 설정 시간에 맞게 트리거)
  workflow_dispatch: # 수동 실행 가능

jobs:
  trigger-auto-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Trade Start API
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          if [ -z "$VERCEL_APP_URL" ]; then
            echo "Error: VERCEL_APP_URL secret is not set."
            exit 1
          fi
          
          TARGET_URL="${VERCEL_APP_URL%/}/api/cron/start"
          echo "Triggering API: $TARGET_URL"
          
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$TARGET_URL" --max-time 30)
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          echo "HTTP Status: $http_status"
          
          if [ "$http_status" -eq 200 ]; then
            echo "✅ Successfully triggered auto trade process."
          else
            echo "❌ Failed to trigger API. Status: $http_status"
            exit 1
          fi
