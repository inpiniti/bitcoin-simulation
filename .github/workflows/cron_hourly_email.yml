name: Scheduled Hourly Email Sender (Every Hour)

on:
  schedule:
    - cron: '0 * * * *' # 매 시간 정각에 실행 (예: 1:00, 2:00, 3:00...)
  workflow_dispatch: # 수동 실행 가능

jobs:
  call-send-api:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Vercel API
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          if [ -z "$VERCEL_APP_URL" ]; then
            echo "Error: VERCEL_APP_URL secret is not set."
            echo "Please set VERCEL_APP_URL in Repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          
          # URL 끝에 슬래시 제거 후 /api/send 추가
          TARGET_URL="${VERCEL_APP_URL%/}/api/simple/send"
          
          echo "Triggering API: $TARGET_URL"
          
          # API 호출 (최대 30초 대기)
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" --max-time 30)
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          
          echo "Response Body: $body"
          echo "HTTP Status: $http_status"
          
          if [ "$http_status" -eq 200 ]; then
            echo "✅ Successfully triggered email send API."
          else
            echo "❌ Failed to trigger API. HTTP Status: $http_status"
            exit 1
          fi
