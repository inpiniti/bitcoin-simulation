name: Update Stock Dataset (Daily)

# 미국 장 종료 1시간 후 실행
# EST 16:00 마감 → 17:00 (UTC 22:00) / 서머타임 적용 시 EDT 16:00 → 17:00 (UTC 21:00)
# 두 시간 모두 커버하기 위해 UTC 21:00, 22:00 실행
on:
  schedule:
    - cron: '0 21 * * 1-5'  # UTC 21:00 (서머타임 시 EST+5 → 16:00+1h)
    - cron: '0 22 * * 1-5'  # UTC 22:00 (비서머타임 시 EST+5 → 17:00+0h)
  workflow_dispatch: # 수동 실행 가능

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Update Stock Dataset via TradingView
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          if [ -z "$VERCEL_APP_URL" ]; then
            echo "Error: VERCEL_APP_URL secret is not set."
            exit 1
          fi
          
          TARGET_URL="${VERCEL_APP_URL%/}/api/simple/updatedataset"
          echo "📊 Triggering DataSet Update: $TARGET_URL"
          echo "⏰ Current UTC Time: $(date -u)"
          
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            "$TARGET_URL" \
            --max-time 120)
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS/d')
          
          echo "HTTP Status: $http_status"
          echo "Response: $body"
          
          if [ "$http_status" -eq 200 ]; then
            echo "✅ DataSet 업데이트 완료"
          else
            echo "❌ DataSet 업데이트 실패. Status: $http_status"
            exit 1
          fi
